name: Fork web builds

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: fork-web-builds-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  web-build:
    name: Fork web build (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [standalone, composed]
    env:
      OPENGENI_WEB_HOST_EXTENSION: ${{ matrix.mode == 'composed' && format('{0}/apps/web/test/fixtures/host-extension-dist', github.workspace) || '' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Verify pinned Bun
        run: bun run check:bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Both guards are fatal Vite plugins in the ordinary build config.
      - name: Build web with eager-graph and chunk-evaluation-order guards
        run: bun run --cwd apps/web build
